<!DOCTYPE html>
<html lang="zxx">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="x-ua-compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="" />
    <meta name="keyword" content="" />
    <meta name="author" content="theme_ocean" />
    <title>KNEKS BACKEND || Dashboard</title>
    <link rel="shortcut icon" type="image/x-icon" href="/assets/images/favicon.ico" />
    <link rel="stylesheet" type="text/css" href="/assets/css/bootstrap.min.css" />
    <link rel="stylesheet" type="text/css" href="/assets/vendors/css/vendors.min.css">
    <link rel="stylesheet" type="text/css" href="/assets/css/theme.min.css" />
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.1/css/buttons.dataTables.min.css">
    <style>
        div.dt-top-container {
            display: grid;
            grid-template-columns: auto auto auto;
        }

        div.dt-center-in-div {
            margin: 0 auto;
        }

        div.dt-filter-spacer {
            margin: 10px 0;
        }
    </style>
</head>

<body>
    <!-- Navigation & Header -->
    <script src="/nav.js"></script>
    <script src="/header.js"></script>

    <main class="nxl-container">
        <div class="nxl-content">
            <!-- [ page-header ] start -->
            <script src="/breadchumb.js"></script>
            <div class="main-content">
                <div class="row">
                    <div class="col-lg-12">
                        <p>
                            <button class="btn btn-primary" onclick="window.location.href = '/zk_add'"> Tambah Zona Khas
                            </button>
                        </p>
                        <div class="card stretch stretch-full">
                            <div class="card-body p-3">
                                <div class="table-responsive">
                                    <table id="zona_khas" class="display" style="width: 100%;">
                                        <thead>
                                            <tr>
                                                <th>ID</th>
                                                <th>Zona Khas</th>
                                                <th>Kota</th>
                                                <th>Provinsi</th>
                                                <th>Status</th>
                                                <th>Tanggal Peresmian</th>
                                                <th>Jumlah Tenant</th>
                                                <th>Diresmikan Oleh</th>
                                                <th>Aksi</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- [ Main Content ] end -->
        </div>
    </main>

    <script src="/assets/vendors/js/vendors.min.js"></script>
    <script src="/assets/js/common-init.min.js"></script>
    <!-- DataTables -->
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/dataTables.buttons.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.html5.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.print.min.js"></script>
    <script src="/assets/js/theme-customizer-init.min.js"></script>
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>

    <script>
        $(document).ready(async function () {

            let provinceMap = {};
            try {
                const response = await fetch('/provinces');
                const data = await response.json();
                if (data && data.length > 0) {
                    data.forEach(p => {
                        provinceMap[p.id] = p.province_name;
                    });
                }
            } catch (error) {
                console.error("Gagal menarik data provinsi:", error);
            }

            const formatDate = (dateString) => {
                if (!dateString) return '-';

                const dateObj = new Date(dateString);
                if (isNaN(dateObj)) return dateString;

                const bulanIndo = [
                    "Januari", "Februari", "Maret", "April", "Mei", "Juni",
                    "Juli", "Agustus", "September", "Oktober", "November", "Desember"
                ];

                const tanggal = dateObj.getDate();
                const bulan = bulanIndo[dateObj.getMonth()];
                const tahun = dateObj.getFullYear();

                return `${tanggal} ${bulan} ${tahun}`;
            };

            $('#zona_khas').DataTable({
                "ajax": {
                    "url": "/zona_peta",
                    "dataSrc": ""
                },
                "columns": [
                    { "data": "id" },
                    { "data": "khas_zone" },
                    { "data": "city" },
                    {
                        "data": "province",
                        "render": function (data, type, row) {
                            return provinceMap[data] ? provinceMap[data] : data;
                        }
                    },
                    {
                        "data": "status",
                        "render": function (data, type, row) {
                            if (!data) return '-';
                            if (data === 'rampung') return '<span class="badge bg-success text-capitalize">Rampung</span>';
                            if (data === 'diresmikan') return '<span class="badge bg-primary text-capitalize">Diresmikan</span>';
                            return `<span class="text-capitalize">${data}</span>`;
                        }
                    },
                    {
                        "data": "inauguration",
                        "render": function (data, type, row) {
                            return formatDate(data);
                        }
                    },
                    { "data": "tenant" },
                    {
                        "data": "inaugurated",
                        "render": function (data, type, row) {
                            return data ? data : '-';
                        }
                    },
                    {
                        "data": null,
                        "render": function (data, type, row) {
                            return `<p><button class='edit-btn-zona-khas btn btn-warning' data-id='${row.id}' style="padding:2px; float: left; margin: 2px"><i class="feather-edit"></i></button>
                                        <button class='delete-btn-zona-khas btn btn-danger' data-id='${row.id}' style="padding:2px; float: left; margin: 2px"><i class="feather-trash"></i></button></p>`;
                        }
                    }
                ],
                lengthMenu: [10, 25, 50, 100],
                dom: '<"dt-top-container"<l><"dt-center-in-div"B><f>r>t<"dt-filter-spacer"f><ip>',
                buttons: ['copy', 'csv', 'excel', 'pdf', 'print'],
            });

            $('#zona_khas').on('click', '.edit-btn-zona-khas', function () {
                var id = $(this).data('id');
                window.location.href = '/zk_edit/' + id;
            });

            $('#zona_khas').on('click', '.delete-btn-zona-khas', function () {
                var id = $(this).data('id');
                swal({
                    title: "Are you sure?",
                    text: "To Delete this Data ??",
                    icon: "warning",
                    buttons: true,
                    dangerMode: true,
                })
                    .then((willOut) => {
                        if (willOut) {
                            window.location = '/deletezonakhas/' + id;
                        }
                    });
            });
        });
    </script>
</body>

</html>
