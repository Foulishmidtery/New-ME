    <script>
        document.getElementById("users_name").value = `${cookie['name']}`;
        document.getElementById("users_id").value = `${cookie['id']}`;

        // Validasi ukuran file gambar maksimal 300KB
        document.getElementById('image').addEventListener('change', function () {
            const maxSize = 300 * 1024; // 300KB dalam bytes
            if (this.files[0].size > maxSize) {
                swal("Gagal!", "Ukuran file foto tidak boleh lebih dari 300KB!", "error"); // Menggunakan sweetalert yang sudah ada di HTML Anda
                this.value = ''; // Reset file input
            }
        });

        function getUrlById() {
            const URLS = new URL(window.location.href);
            fetch('/api_opini_detail/' + URLS.pathname.split('/')[2])
                .then(data => data.json())
                .then((rows) => {
                    document.getElementById("id").value = rows[0]?.id;
                    document.getElementById("title").value = rows[0]?.title;
                    document.getElementById("title_en").value = rows[0]?.title_en;
                    nicEditors.findEditor("editor3").setContent(rows[0]?.content);
                    nicEditors.findEditor("editor4").setContent(rows[0]?.content_en);
                    document.getElementById("image_opini").innerHTML = `<img src="${rows[0]?.images}" width="100">`;
                    const tgl = new Date(rows[0]?.date_created);
                    document.getElementById("tanggal_opini").value = tgl.toLocaleDateString('en-CA');
                    localStorage.setItem("object_dir", rows[0]?.directorat)
                    localStorage.setItem("prov_idkdeks", rows[0]?.id_province);
                    if (rows[0]?.is_publish == 'on') {
                        document.getElementById("publish_opini").innerHTML = ` 
                                             <div class="form-check form-switch">
                                                <input class="form-check-input" type="checkbox" role="switch" name="is_published" id="publish" checked>
                                                <label class="form-check-label" for="publish"></label>
                                              </div>`;
                    } else {
                        document.getElementById("publish_opini").innerHTML = ` 
                                             <div class="form-check form-switch">
                                                <input class="form-check-input" type="checkbox" role="switch" name="is_published" id="publish" checked>
                                                <label class="form-check-label" for="publish"></label>
                                              </div>`;
                    }

                })
        }
        function getTagging() {
            fetch('/tagging')
                .then(res => res.json())
                .then((rrr) => {
                    let ttt = "";
                    rrr.forEach(items => {
                        ttt += `${items?.tagging},`;
                    });
                    document.getElementById("tag").innerHTML = ttt;
                    document.getElementById("tagify").value = ttt;
                })
        }

        function getProvinces() {
            fetch('/provinces')
                .then(response => response.json())
                .then((data) => {
                    const getArrays = localStorage.getItem("prov_idkdeks");
                    let arrays = [];
                    if (getArrays.length <= 1) {
                        arrays.push(getArrays);
                    } else {
                        const str = getArrays.replace(/[{}"]/g, "").split(",")
                            .map(Number)
                            .join(",");
                        let chars = str.split(",").map(Number);
                        arrays.push(chars)
                    }
                    var opt = [];
                    data.forEach(element => {
                        opt.push('<option value="' + element?.id + '">' + element?.province_name + '</option>');
                    });
                    $('#mySelect3').empty().append(opt).trigger('change');
                    $('#mySelect3').val(arrays[0]).trigger('change');

                })
        }

        function getDirectorats() {
            $.ajax({
                url: '/directorat_fe',
                type: 'GET',
                dataType: 'json',
                success: function (data) {
                    const getArray = localStorage.getItem("object_dir");
                    let array = [];
                    if (getArray.length <= 1) {
                        array.push(getArray[0]);
                    } else {
                        const strings = getArray.replace(/[{}"]/g, "").split(",")
                            .map(Number)
                            .join(",");
                        for (let char of strings) {
                            if (char !== ',') {
                                array.push(char);
                            }
                        }
                    }
                    var options = [];
                    $.each(data, function (index, value) {
                        options.push('<option value="' + value.id + '">' + value.title + '</option>');
                    });
                    $('#mySelect2').empty().append(options).trigger('change');
                    $('#mySelect2').val(array).trigger('change');
                }
            });
        }

        $(document).ready(function () {
            const inputElm = document.querySelector('input.tagify');
            new Tagify(inputElm);
            getUrlById()
            getTagging()
            getProvinces();
            getDirectorats();
            $('#mySelect2').select2();
            $('#mySelect3').select2();
        });
    </script>
    <script>
        document.querySelector('form').addEventListener('submit', function (e) {
            if (nicEditors && nicEditors.editors) {
                for (var i = 0; i < nicEditors.editors.length; i++) {
                    nicEditors.editors[i].nicInstances.forEach(function (instance) {
                        instance.saveContent();
                    })
                }
            }

            ['editor3', 'editor4'].forEach(function (id) {
                var textarea = document.getElementById(id);
                if (textarea) {
                    var isi = textarea.value;

                    isi = isi.replace(/<(b|strong)[^>]*>\s*<(i|em)[^>]*>/gi, '<span style="font-weight: bold; font-style: italic;">');
                    isi = isi.replace(/<(i|em)[^>]*>\s*<(b|strong)[^>]*>/gi, '<span style="font-weight: bold; font-style: italic;">');
                    isi = isi.replace(/<\/(i|em)>\s*<\/(b|strong)>/gi, '</span>');
                    isi = isi.replace(/<\/(b|strong)>\s*<\/(i|em)>/gi, '</span>');
                    isi = isi.replace(/<(i|em)[^>]*>/gi, '<span style="font-style: italic;">');
                    isi = isi.replace(/<\/(i|em)>/gi, '</span>');
                    isi = isi.replace(/<(b|strong)[^>]*>/gi, '<span style="font-weight: bold;">');
                    isi = isi.replace(/<\/(b|strong)>/gi, '</span>');
                    isi = isi.replace(/font-size[^;"]*;/gi, '');
                    isi = isi.replace(/font-family[^;"]*;/gi, '');
                    isi = isi.replace(/margin[^;]*;/gi, '');
                    isi = isi.replace(/line-height[^;]*;/gi, '');
                    isi = isi.replace(/text-align[^;]*;/gi, '');
                    isi = isi.replace(/class="MsoNormal"/gi, '');

                    textarea.value = isi;
                }
            });
        });
    </script>
